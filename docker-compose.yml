services:
  mongodb:
    image: mongo:8.2
    command:
      - mongod
      - "--wiredTigerCacheSizeGB"
      - "${MONGO_CACHE_GB:-0.5}"
      - "--maxConns"
      - "${MONGO_MAX_CONN:-100}"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build: .
    working_dir: /app
    command: ["python", "run.py"]
    environment:
      STORE_BACKEND: mongo
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB: warehouse
      MONGO_TEST_URI: "mongodb://mongodb:27017?serverMonitoringMode=poll"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./:/app
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
    name: warehouse-mongo-data
